<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NEXA HD</title>
<style>
:root{
  --bg:#050505;
  --panel:#0b0b0f;
  --panel2:#101016;
  --line:#202027;
  --purple:#54258f;
  --purple2:#3b176d;
  --accent:#6d3db8;
  --text:#ededf0;
  --muted:#898992;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  min-height:100vh;
}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.app{
  width:100%;
  max-width:560px;
  min-height:100vh;
  margin:auto;
  padding:24px 20px 100px;
  position:relative;
  overflow:hidden;
}
.app:before{
  content:"";
  position:fixed;
  width:280px;height:280px;
  right:-140px;top:80px;
  background:var(--purple2);
  filter:blur(110px);
  opacity:.18;
  pointer-events:none;
}
.top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:28px;
}
.brand small{
  display:block;color:var(--muted);font-size:11px;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:3px;
}
.brand h1{font-size:23px;letter-spacing:-.7px}
.avatar{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(145deg,#17131d,#0d0d11);
  border:1px solid var(--line);
  display:grid;place-items:center;font-weight:800;
  box-shadow:0 0 22px rgba(84,37,143,.16);
}
.hero{
  border:1px solid var(--line);
  background:linear-gradient(145deg,#111017,#09090c);
  border-radius:28px;padding:28px;
  position:relative;overflow:hidden;
  margin-bottom:14px;
}
.hero:after{
  content:"";
  position:absolute;width:170px;height:170px;
  right:-70px;top:-75px;border-radius:50%;
  background:var(--purple);filter:blur(55px);opacity:.27;
}
.tag{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 10px;border-radius:999px;
  background:#15101c;border:1px solid #2a1c3a;
  color:#b995df;font-size:11px;font-weight:700;
  margin-bottom:17px;
}
.dot{width:6px;height:6px;border-radius:50%;background:#8050bd}
.hero h2{font-size:34px;line-height:1.05;letter-spacing:-1.3px;max-width:280px}
.hero p{font-size:13px;color:var(--muted);line-height:1.55;margin-top:10px;max-width:320px}
.hero-btn{
  margin-top:19px;padding:12px 15px;border-radius:13px;
  background:#151019;border:1px solid #2b2037;
  font-size:12px;font-weight:700;
}
.section-head{
  display:flex;justify-content:space-between;align-items:center;
  margin:24px 2px 11px;
}
.section-head h3{font-size:15px}
.section-head span{font-size:11px;color:var(--muted)}
.tools{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.tool{
  min-height:175px;padding:20px;border-radius:22px;
  background:var(--panel);border:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:space-between;
  text-align:left;transition:.2s;
}
.tool:active{transform:scale(.98);border-color:#382050}
.icon{
  width:38px;height:38px;border-radius:12px;
  background:#16111d;border:1px solid #2a2033;
  display:grid;place-items:center;color:#a875d5;font-size:18px;
}
.tool h4{font-size:14px;margin-top:12px}
.tool p{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35}
.tool b{font-size:10px;color:#a875d5}
.premium{
  margin-top:10px;padding:17px;border-radius:20px;
  border:1px solid #2b1d3b;
  background:linear-gradient(135deg,#120d18,#0a0a0d);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.premium h4{font-size:14px}
.premium p{font-size:11px;color:var(--muted);margin-top:4px}
.upgrade{
  padding:10px 13px;border-radius:12px;
  background:var(--purple2);border:1px solid #5b318b;
  font-size:11px;font-weight:800;white-space:nowrap;
}
.plan{
  margin-top:10px;border:1px solid var(--line);background:var(--panel);
  border-radius:20px;padding:16px;
}
.plan-row{display:flex;justify-content:space-between;align-items:center}
.plan-title{font-size:13px;font-weight:700}
.plan-count{font-size:12px;color:#a875d5}
.progress{height:5px;background:#18181d;border-radius:10px;margin-top:12px;overflow:hidden}
.progress i{display:block;width:33%;height:100%;background:var(--accent);border-radius:10px}
.bottom{
  position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
  width:min(calc(100% - 24px),536px);
  padding:8px 7px;
  border-radius:20px;
  background:rgba(12,12,16,.92);
  border:1px solid #24242b;
  backdrop-filter:blur(18px);
  display:grid;grid-template-columns:repeat(4,1fr);
  z-index:5;
}
.nav{
  background:none;padding:8px 2px;border-radius:14px;
  color:#666670;font-size:9px;display:flex;flex-direction:column;
  align-items:center;gap:4px;
}
.nav strong{font-size:17px;line-height:1}
.nav.active{color:#b67ce3;background:#17111e}
.toast{
  position:fixed;left:50%;bottom:84px;transform:translate(-50%,15px);
  background:#151219;border:1px solid #30223d;border-radius:13px;
  padding:11px 15px;font-size:12px;opacity:0;pointer-events:none;
  transition:.25s;white-space:nowrap;z-index:9;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){
  body{background:#020202}
  .app{border-left:1px solid #111;border-right:1px solid #111}
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <small>NEXA LABS</small>
      <h1>NEXA HD</h1>
    </div>
    <div class="avatar">N</div>
  </header>

  <section class="hero">
    <div class="tag"><i class="dot"></i> AUTO-PROCESS</div>
    <h2>Bikin media kamu lebih tajam.</h2>
    <p>Tingkatkan kualitas foto dan upscale video hingga resolusi 4K.</p>
    <button class="hero-btn" onclick="toast('Pilih fitur Enhance untuk mulai')">Mulai Enhance →</button>
  </section>

  <div class="section-head">
    <h3>Tools</h3><span>NEXA HD</span>
  </div>

  <section class="tools">
    <button class="tool" onclick="toast('Enhance Photo dibuka')">
      <div class="icon">✦</div>
      <div>
        <h4>Enhance Photo</h4>
        <p>Perjelas detail dan naikkan resolusi foto.</p>
        <b>720P • 1080P • 2K • 4K</b>
      </div>
    </button>
    <button class="tool" onclick="toast('Upscale Video dibuka')">
      <div class="icon">▶</div>
      <div>
        <h4>Upscale Video</h4>
        <p>Perbesar video tanpa mengubah isinya.</p>
        <b>720P • 1080P • 2K • 4K</b>
      </div>
    </button>
  </section>

  <div class="section-head">
    <h3>Membership</h3><span>Upgrade</span>
  </div>

  <section class="premium">
    <div>
      <h4>NEXA HD Premium</h4>
      <p>Akses kualitas tertinggi & limit tanpa batas.</p>
    </div>
    <button class="upgrade" onclick="toast('Menu Premium')">UPGRADE</button>
  </section>

  <section class="plan">
    <div class="plan-row">
      <div class="plan-title">Free Plan</div>
      <div class="plan-count">1 / 3 hari ini</div>
    </div>
    <div class="progress"><i></i></div>
  </section>
</main>

<nav class="bottom">
  <button class="nav active" onclick="setNav(this)"><strong>⌂</strong>Home</button>
  <button class="nav" onclick="setNav(this);toast('Enhance')"><strong>✦</strong>Enhance</button>
  <button class="nav" onclick="setNav(this);toast('History')"><strong>◷</strong>History</button>
  <button class="nav" onclick="setNav(this);toast('Profile')"><strong>○</strong>Profile</button>
</nav>

<div class="toast" id="toast"></div>
<script>
function setNav(el){
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
}
let timer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1600);
}
</script>
</body>
</html>
