<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUSTAV HD — Button Library</title>
<style>
/* ============ ROOT ============ */
:root{
  --bg:#050505;
  --panel:#0b0b0f;
  --panel2:#101016;
  --line:#202027;
  --deep:#3b176d;
  --purple:#54258f;
  --accent:#6d3db8;
  --green:#22c55e;
  --red:#ef4444;
  --text:#e5e5e7;
  --text2:#8a8a94;
  --muted:#555560;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding:32px 20px 60px;
}
.container{
  max-width:640px;margin:0 auto;
}
h1{
  font-size:24px;font-weight:800;color:#fff;
  letter-spacing:-.7px;margin-bottom:8px;
}
.subtitle{
  font-size:12px;color:var(--text2);
  margin-bottom:32px;letter-spacing:.5px;
}
.section{margin-bottom:36px}
.section-title{
  font-size:10.5px;color:var(--text2);
  letter-spacing:1.8px;text-transform:uppercase;
  font-weight:700;margin-bottom:14px;
  padding-left:4px;
}

/* ==================================================
   ============ TOMBOL LIBRARY ======================
   ================================================== */

/* ---------- TYPE 1: PRIMARY ---------- */
.btn-primary{
  position:relative;
  width:100%;
  padding:18px 22px;
  border-radius:16px;
  background:linear-gradient(145deg,#3b176d,#54258f);
  border:1px solid rgba(109,61,184,.6);
  color:#f0e6ff;
  font-size:13.5px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer;
  overflow:hidden;
  transition:transform .18s ease, box-shadow .25s ease;
  box-shadow:
    0 0 0 1px rgba(84,37,143,.15) inset,
    0 10px 30px rgba(84,37,143,.4);
  font-family:inherit;
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:
    0 0 0 1px rgba(109,61,184,.5) inset,
    0 16px 40px rgba(84,37,143,.6);
}
.btn-primary:active{
  transform:scale(.98) translateY(0);
}
.btn-primary .icon{
  font-size:16px;
  line-height:1;
}
/* Ripple */
.btn-primary .ripple,
.btn-secondary .ripple,
.btn-danger .ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.25);
  transform:scale(0);
  animation:ripple .6s ease-out;
  pointer-events:none;
}
@keyframes ripple{
  to{transform:scale(4);opacity:0}
}

/* ---------- TYPE 2: SECONDARY ---------- */
.btn-secondary{
  position:relative;
  width:100%;
  padding:17px 22px;
  border-radius:15px;
  background:rgba(59,23,109,.15);
  border:1px solid rgba(109,61,184,.4);
  color:#c9a8ee;
  font-size:13px;
  font-weight:700;
  letter-spacing:.4px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  cursor:pointer;
  overflow:hidden;
  transition:all .2s ease;
  font-family:inherit;
}
.btn-secondary:hover{
  background:rgba(59,23,109,.3);
  border-color:rgba(109,61,184,.7);
  transform:translateY(-1px);
  color:#e5d4fa;
}
.btn-secondary:active{
  transform:scale(.98);
}
.btn-secondary .icon{font-size:15px;line-height:1}

/* ---------- TYPE 3: GHOST ---------- */
.btn-ghost{
  background:transparent;
  border:0;
  color:#a67fd0;
  font-size:12.5px;
  font-weight:600;
  padding:9px 14px;
  border-radius:10px;
  cursor:pointer;
  transition:all .2s ease;
  letter-spacing:.3px;
  font-family:inherit;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn-ghost:hover{
  background:rgba(59,23,109,.25);
  color:#c9a8ee;
}
.btn-ghost:active{
  transform:scale(.97);
}

/* ---------- TYPE 4: DANGER ---------- */
.btn-danger{
  position:relative;
  width:100%;
  padding:17px 22px;
  border-radius:16px;
  background:rgba(80,20,20,.25);
  border:1px solid rgba(239,68,68,.25);
  color:#ef4444;
  font-size:13px;
  font-weight:700;
  letter-spacing:.4px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  cursor:pointer;
  overflow:hidden;
  transition:all .2s ease;
  font-family:inherit;
}
.btn-danger:hover{
  background:rgba(80,20,20,.4);
  border-color:rgba(239,68,68,.5);
  transform:translateY(-1px);
}
.btn-danger:active{
  transform:scale(.98);
}
.btn-danger .icon{font-size:15px;line-height:1}

/* ---------- TYPE 5: ICON BUTTON ---------- */
.btn-icon{
  width:46px;
  height:46px;
  border-radius:50%;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  font-size:17px;
  display:grid;
  place-items:center;
  cursor:pointer;
  transition:all .2s ease;
  font-family:inherit;
  flex-shrink:0;
}
.btn-icon:hover{
  border-color:var(--accent);
  transform:scale(1.06);
  color:#e5d4fa;
}
.btn-icon:active{
  transform:scale(.94);
}
.btn-icon.small{
  width:38px;height:38px;font-size:14px;
}
.btn-icon.danger:hover{
  border-color:var(--red);
  color:var(--red);
}

/* ---------- TYPE 6: PILL BUTTON (chip) ---------- */
.btn-pill{
  padding:8px 14px;
  border-radius:999px;
  background:rgba(59,23,109,.22);
  border:1px solid rgba(109,61,184,.5);
  color:#c9a8ee;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .2s ease;
  font-family:inherit;
}
.btn-pill:hover{
  background:rgba(59,23,109,.4);
  border-color:var(--accent);
}
.btn-pill:active{transform:scale(.97)}

/* ---------- TYPE 7: LOADING STATE ---------- */
.btn-primary.loading{
  pointer-events:none;
  opacity:.8;
}
.btn-primary .spinner{
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
  display:none;
}
.btn-primary.loading .spinner{display:inline-block}
.btn-primary.loading .icon{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- TYPE 8: SUCCESS STATE ---------- */
.btn-primary.success{
  background:linear-gradient(145deg,#15803d,#22c55e);
  border-color:rgba(34,197,94,.6);
  box-shadow:
    0 0 0 1px rgba(34,197,94,.2) inset,
    0 10px 30px rgba(34,197,94,.4);
}

/* ---------- TYPE 9: DISABLED ---------- */
.btn-primary:disabled,
.btn-secondary:disabled{
  background:#15151a;
  border-color:var(--line);
  color:var(--muted);
  box-shadow:none;
  cursor:not-allowed;
  transform:none;
  letter-spacing:.4px;
}
.btn-primary:disabled:hover{
  transform:none;
  box-shadow:none;
}
.btn-primary:disabled .icon{opacity:.5}

/* ---------- GRID LAYOUT ---------- */
.btn-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.icon-row{
  display:flex;gap:14px;align-items:center;
  flex-wrap:wrap;
}
</style>
</head>
<body>
<div class="container">

  <h1>GUSTAV HD</h1>
  <p class="subtitle">Button Library — Preview semua tipe tombol</p>

  <!-- ==================== PRIMARY ==================== -->
  <div class="section">
    <div class="section-title">1. Primary — Tombol Utama</div>

    <button class="btn-primary">
      <span class="icon">⚡</span>
      Mulai Enhance
    </button>

    <div style="height:12px"></div>

    <button class="btn-primary">
      <span class="icon">⬇</span>
      Simpan
    </button>

    <div style="height:12px"></div>

    <button class="btn-primary" disabled>
      <span class="icon">⚡</span>
      Mulai Enhance
    </button>
  </div>

  <!-- ==================== SECONDARY ==================== -->
  <div class="section">
    <div class="section-title">2. Secondary — Tombol Kedua</div>

    <div class="btn-row">
      <button class="btn-secondary">
        <span class="icon">⇧</span>
        Bagikan
      </button>
      <button class="btn-secondary">
        <span class="icon">⟲</span>
        Ulangi
      </button>
    </div>

    <div style="height:12px"></div>

    <button class="btn-secondary">
      <span class="icon">⟲</span>
      Ulangi Enhance
    </button>
  </div>

  <!-- ==================== GHOST ==================== -->
  <div class="section">
    <div class="section-title">3. Ghost — Tombol Ringan</div>

    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="color:var(--text2);font-size:13px;">Lihat semua</span>
      <button class="btn-ghost">
        See all →
      </button>
    </div>

    <div style="height:8px"></div>

    <button class="btn-ghost">Nanti</button>
    <button class="btn-ghost">Batal</button>
  </div>

  <!-- ==================== DANGER ==================== -->
  <div class="section">
    <div class="section-title">4. Danger — Tombol Bahaya</div>

    <button class="btn-danger">
      <span class="icon">⏻</span>
      Log out
    </button>
  </div>

  <!-- ==================== ICON ==================== -->
  <div class="section">
    <div class="section-title">5. Icon Button</div>

    <div class="icon-row">
      <button class="btn-icon">←</button>
      <button class="btn-icon">✎</button>
      <button class="btn-icon">✕</button>
      <button class="btn-icon">🔇</button>
      <button class="btn-icon">🔊</button>
      <button class="btn-icon danger">⏻</button>
    </div>

    <div style="height:12px"></div>

    <div class="icon-row">
      <button class="btn-icon small">←</button>
      <button class="btn-icon small">✎</button>
      <button class="btn-icon small">✕</button>
    </div>
  </div>

  <!-- ==================== PILL ==================== -->
  <div class="section">
    <div class="section-title">6. Pill — Chip & Badge</div>

    <div class="icon-row">
      <button class="btn-pill">Free</button>
      <button class="btn-pill">Premium</button>
      <button class="btn-pill">4K Ultra HD</button>
      <button class="btn-pill">Owner</button>
    </div>
  </div>

  <!-- ==================== LOADING & SUCCESS ==================== -->
  <div class="section">
    <div class="section-title">7. Loading & Success State</div>

    <button class="btn-primary" id="btnLoading" onclick="testLoading(this)">
      <span class="spinner"></span>
      <span class="icon">⚡</span>
      Mulai Enhance
    </button>

    <div style="height:12px"></div>

    <button class="btn-primary" id="btnSuccess" onclick="testSuccess(this)">
      <span class="icon">⬇</span>
      Simpan
    </button>
  </div>

  <!-- ==================== COMBINED ==================== -->
  <div class="section">
    <div class="section-title">8. Kombinasi — Seperti di Halaman 2C</div>

    <div class="btn-row">
      <button class="btn-secondary">
        <span class="icon">⇧</span>
        Bagikan
      </button>
      <button class="btn-primary" style="padding:17px 22px;font-size:12.5px;">
        <span class="icon">⬇</span>
        Simpan
      </button>
    </div>

    <div style="height:12px"></div>

    <button class="btn-secondary">
      <span class="icon">⟲</span>
      Ulangi Enhance
    </button>
  </div>

</div>

<script>
/* ============ RIPPLE EFFECT ============ */
document.querySelectorAll('.btn-primary, .btn-secondary, .btn-danger').forEach(btn => {
  btn.addEventListener('click', function(e){
    if(this.disabled || this.classList.contains('loading')) return;

    const rect = this.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    this.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });
});

/* ============ TEST LOADING ============ */
function testLoading(btn){
  btn.classList.add('loading');
  btn.innerHTML = `<span class="spinner"></span> Memproses...`;

  setTimeout(() => {
    btn.classList.remove('loading');
    btn.innerHTML = `<span class="icon">⚡</span> Mulai Enhance`;
    btn.style.pointerEvents = 'auto';
  }, 2500);
}

/* ============ TEST SUCCESS ============ */
function testSuccess(btn){
  const original = btn.innerHTML;
  btn.classList.add('success');
  btn.innerHTML = `<span class="icon">✓</span> Berhasil`;

  setTimeout(() => {
    btn.classList.remove('success');
    btn.innerHTML = original;
  }, 1800);
}
</script>
</body>
</html>
