<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HD Studio</title>
<style>
:root{
  --bg:#000;
  --card:#0d0d10;
  --line:#1f1f26;
  --purple:#7c3aed;
  --purple2:#a855f7;
  --text:#fff;
  --muted:#8a8a92;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
  display:flex;justify-content:center;
}
.app{
  width:100%;max-width:480px;
  padding:24px 20px 120px;
  position:relative;
}
.app::before{
  content:"";position:fixed;
  width:280px;height:280px;
  top:-100px;right:-120px;
  background:var(--purple);
  filter:blur(120px);opacity:.25;
  pointer-events:none;
}
header{margin-bottom:24px}
header h1{
  font-size:22px;letter-spacing:-.5px;
  display:flex;align-items:center;gap:8px;
}
header h1 span{
  width:8px;height:8px;border-radius:50%;
  background:var(--purple2);
  box-shadow:0 0 12px var(--purple2);
  animation:pulse 1.6s infinite;
}
@keyframes pulse{50%{opacity:.4}}
header p{font-size:12px;color:var(--muted);margin-top:6px}

/* Upload area */
.upload{
  border:1.5px dashed #2a2a33;
  border-radius:20px;
  padding:36px 20px;
  text-align:center;
  background:var(--card);
  transition:.25s;
  cursor:pointer;
  margin-bottom:16px;
}
.upload:hover{border-color:var(--purple2);background:#131318}
.upload .ico{
  width:56px;height:56px;border-radius:16px;
  background:#16111d;border:1px solid #2a2033;
  display:grid;place-items:center;
  margin:0 auto 14px;
  color:var(--purple2);
}
.upload .ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.upload b{font-size:14px;display:block}
.upload small{font-size:11px;color:var(--muted);display:block;margin-top:6px}

/* Preview */
.preview{
  display:none;
  border-radius:18px;
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  margin-bottom:16px;
}
.preview.show{display:block}
.preview img{
  width:100%;display:block;
  aspect-ratio:16/10;object-fit:cover;
  background:#111;
}
.preview .info{
  padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;
  border-top:1px solid var(--line);
}
.preview .info b{font-size:12px;font-weight:600}
.preview .info span{font-size:11px;color:var(--muted)}
.preview .remove{
  width:28px;height:28px;border-radius:8px;
  background:#1a1a20;border:1px solid #2a2a33;
  display:grid;place-items:center;
  cursor:pointer;color:#ef4444;
}
.preview .remove svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* Section label */
.label{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;
  margin:6px 4px 12px;
}
.label svg{width:15px;height:15px;fill:var(--purple2)}

/* Resolusi grid */
.grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-bottom:22px;
}
.res{
  padding:16px;border-radius:16px;
  background:var(--card);
  border:1px solid var(--line);
  text-align:left;cursor:pointer;
  transition:.2s;color:var(--text);
  font-family:inherit;
}
.res:active{transform:scale(.97)}
.res.selected{
  background:linear-gradient(145deg,#3b0764,#1a0f2e);
  border-color:var(--purple2);
  box-shadow:0 0 24px rgba(168,85,247,.35);
}
.res h4{font-size:19px;font-weight:800;letter-spacing:-.3px}
.res p{font-size:10px;color:var(--muted);margin-top:4px}
.res.selected p{color:#c4b5fd}

/* Action button */
.action{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  width:calc(100% - 40px);max-width:440px;
  padding:16px;border-radius:16px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;font-size:14px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;border:0;
  box-shadow:0 10px 30px rgba(124,58,237,.4);
  font-family:inherit;
  transition:.2s;
}
.action:active{transform:translateX(-50%) scale(.97)}
.action:disabled{
  background:#1a1a20;color:#5a5a62;
  box-shadow:none;cursor:not-allowed;
}
.action svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}

/* Toast */
.toast{
  position:fixed;bottom:100px;left:50%;
  transform:translate(-50%,15px);
  background:#1a1a20;border:1px solid #2a2a33;
  border-radius:12px;padding:11px 16px;
  font-size:12px;opacity:0;pointer-events:none;
  transition:.25s;white-space:nowrap;z-index:50;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1><span></span> HD Studio</h1>
    <p>Tingkatkan kualitas foto hingga 4K</p>
  </header>

  <!-- Upload -->
  <label class="upload" for="file">
    <div class="ico">
      <svg viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
    </div>
    <b>Pilih Foto</b>
    <small>JPG, PNG, WEBP — maks 10MB</small>
    <input type="file" id="file" accept="image/*" hidden>
  </label>

  <!-- Preview -->
  <div class="preview" id="preview">
    <img id="previewImg" alt="preview">
    <div class="info">
      <div>
        <b id="fileName">-</b><br>
        <span id="fileSize">-</span>
      </div>
      <div class="remove" onclick="reset()">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </div>
    </div>
  </div>

  <!-- Resolusi -->
  <div class="label">
    <svg viewBox="0 0 24 24"><path d="M12 2l1.5 5L19 8.5 13.5 10 12 15l-1.5-5L5 8.5 10.5 7 12 2z"/></svg>
    Pilih Output Resolution
  </div>
  <div class="grid">
    <button class="res" data-r="720" onclick="pick(this)"><h4>720p</h4><p>HD Ready</p></button>
    <button class="res" data-r="1080" onclick="pick(this)"><h4>1080p</h4><p>Full HD</p></button>
    <button class="res" data-r="1440" onclick="pick(this)"><h4>2K</h4><p>Ultra HD</p></button>
    <button class="res selected" data-r="2160" onclick="pick(this)"><h4>4K</h4><p>Ultra HD</p></button>
  </div>

  <button class="action" id="btnProcess" disabled onclick="process()">
    <svg viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
    Mulai Enhance
  </button>
</main>

<div class="toast" id="toast"></div>

<script>
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const fileName = document.getElementById('fileName');
const fileSize = document.getElementById('fileSize');
const btnProcess = document.getElementById('btnProcess');
let currentFile = null;
let currentRes = 2160;

// Upload
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if(!f) return;
  if(f.size > 10 * 1024 * 1024){
    toast('File terlalu besar (maks 10MB)');
    return;
  }
  currentFile = f;
  const url = URL.createObjectURL(f);
  previewImg.src = url;
  fileName.textContent = f.name;
  fileSize.textContent = (f.size/1024).toFixed(1) + ' KB';
  preview.classList.add('show');
  btnProcess.disabled = false;
  toast('Foto berhasil diupload');
});

// Pilih resolusi
function pick(el){
  document.querySelectorAll('.res').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
  currentRes = parseInt(el.dataset.r);
}

// Reset
function reset(){
  currentFile = null;
  fileInput.value = '';
  preview.classList.remove('show');
  btnProcess.disabled = true;
}

// Proses (masih dummy di tahap 1)
function process(){
  if(!currentFile) return;
  toast(`Memproses ${currentRes}p... (tahap 1: dummy)`);
  setTimeout(() => toast('Selesai! (belum HD asli)'), 1500);
}

// Toast
let t;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(t);
  t = setTimeout(() => el.classList.remove('show'), 1800);
}
</script>
</body>
</html>
